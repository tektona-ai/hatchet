# Local/dev NATS for the pub/sub and durable message queue backends. Task
# stream events exceed the default 1MiB max_payload; match Hatchet's 16MiB
# message-size contract (msgqueue.MaxMessageSize).
max_payload: 16777216

# JetStream is required only by the durable message queue
# (SERVER_MSGQUEUE_KIND=nats); the pub/sub backend uses core NATS. It is
# enabled unconditionally here so one dev server serves both.
jetstream {
  store_dir: /data/jetstream

  # Dev-sized limits. Production deployments should size these to the expected
  # task backlog: a work-queue stream holds every unacked message, so a stalled
  # consumer is bounded by max_file_store rather than by memory.
  max_memory_store: 268435456
  max_file_store: 10737418240
}
