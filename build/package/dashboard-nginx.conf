worker_processes 4;

events { worker_connections 1024; }

http {
    server {
        listen 80;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;
        index  index.html index.htm;

        include /etc/nginx/conf.d/hatchet-app.conf;

        # Written by the entrypoint, which resolves the upstream from
        # HATCHET_API_UPSTREAM.
        include /etc/nginx/conf.d/hatchet-api.conf;
    }
}
