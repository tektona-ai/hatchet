# Disabled in this fork.
#
# Upstream's automation cannot run here: it targets ghcr.io/hatchet-dev, uses
# self-hosted runners (hatchet-arm64-2, ubicloud-*) that this repository does
# not have, publishes packages with secrets it does not hold, or automates the
# upstream project's own issue and PR triage.
#
# Only the automatic triggers are removed; any existing workflow_dispatch block
# is kept verbatim so manual runs still work and expressions that reference its
# inputs still resolve. Files are not deleted, so the body stays identical to
# upstream and merges stay clean.
name: Commit Lint

on:
  workflow_dispatch:
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"


      - name: Install commitlint
        run: |
          pnpm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title (used as squash commit message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint
