# Disabled in this fork.
#
# Upstream's automation cannot run here: it targets ghcr.io/hatchet-dev, uses
# self-hosted runners (hatchet-arm64-2, ubicloud-*) that this repository does
# not have, publishes packages with secrets it does not hold, or automates the
# upstream project's own issue and PR triage.
#
# Only the automatic triggers are removed; any existing workflow_dispatch block
# is kept verbatim so manual runs still work and expressions that reference its
# inputs still resolve. Files are not deleted, so the body stays identical to
# upstream and merges stay clean.
name: go
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: ./sdks/go

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compile Go SDK examples
        run: |
          # Find all directories with go.mod files
          for dir in $(find examples -name "go.mod" -exec dirname {} \;); do
            echo "Compiling $dir (has go.mod)"
            cd "$dir"
            go build ./...
            cd - > /dev/null
          done

          # Find directories with main.go but no go.mod (use parent's go.mod)
          for dir in $(find examples -name "main.go" -exec dirname {} \; | while read d; do
            if [ ! -f "$d/go.mod" ]; then
              echo "$d"
            fi
          done | sort -u); do
            echo "Compiling $dir (uses parent go.mod)"
            cd "$dir"
            go build .
            cd - > /dev/null
          done
