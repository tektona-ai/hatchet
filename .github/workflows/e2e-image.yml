# Disabled in this fork.
#
# Upstream's automation cannot run here: it targets ghcr.io/hatchet-dev, uses
# self-hosted runners (hatchet-arm64-2, ubicloud-*) that this repository does
# not have, publishes packages with secrets it does not hold, or automates the
# upstream project's own issue and PR triage.
#
# Only the automatic triggers are removed; any existing workflow_dispatch block
# is kept verbatim so manual runs still work and expressions that reference its
# inputs still resolve. Files are not deleted, so the body stays identical to
# upstream and merges stay clean.
name: e2e-image
on:
  workflow_dispatch:
jobs:
  build-push-e2e-go:
    name: hatchet-e2e-go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/e2e-go.dockerfile \
            -t ghcr.io/hatchet-dev/hatchet/hatchet-e2e-go:${{ github.sha }} \
            -t ghcr.io/hatchet-dev/hatchet/hatchet-e2e-go:main \
            --platform linux/amd64 \
            .
          docker push ghcr.io/hatchet-dev/hatchet/hatchet-e2e-go:${{ github.sha }}
          docker push ghcr.io/hatchet-dev/hatchet/hatchet-e2e-go:main

  build-push-e2e-python:
