# Disabled in this fork.
#
# Upstream's automation cannot run here: it targets ghcr.io/hatchet-dev, uses
# self-hosted runners (hatchet-arm64-2, ubicloud-*) that this repository does
# not have, publishes packages with secrets it does not hold, or automates the
# upstream project's own issue and PR triage.
#
# Only the automatic triggers are removed; any existing workflow_dispatch block
# is kept verbatim so manual runs still work and expressions that reference its
# inputs still resolve. Files are not deleted, so the body stays identical to
# upstream and merges stay clean.
name: VS Code Extension CI

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: vscode-extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/vscode-extension/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend/vscode-extension
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend/vscode-extension
        run: pnpm run typecheck

      - name: Test
        working-directory: frontend/vscode-extension
        run: pnpm test

      - name: Build
        working-directory: frontend/vscode-extension
        run: pnpm build:prod

      # Runs `vsce package`, which is where packaging/toolchain issues surface
      # (e.g. an incompatible minimatch resolution) that the build alone misses.
      - name: Package
        working-directory: frontend/vscode-extension
        run: pnpm package --out hatchet-ci.vsix
