# Disabled in this fork.
#
# Upstream's automation cannot run here: it targets ghcr.io/hatchet-dev, uses
# self-hosted runners (hatchet-arm64-2, ubicloud-*) that this repository does
# not have, publishes packages with secrets it does not hold, or automates the
# upstream project's own issue and PR triage.
#
# Only the automatic triggers are removed; any existing workflow_dispatch block
# is kept verbatim so manual runs still work and expressions that reference its
# inputs still resolve. Files are not deleted, so the body stays identical to
# upstream and merges stay clean.
name: "Vouch: manage by issue comment"

on:
  workflow_dispatch:

permissions: {}

jobs:
  manage:
    if: contains(github.event.comment.body, '!vouch') || contains(github.event.comment.body, '!denounce') || contains(github.event.comment.body, '!unvouch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.VOUCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: mitchellh/vouch/action/manage-by-issue@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        id: vouch
        with:
          issue-id: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          vouch-keyword: "!vouch"
          denounce-keyword: "!denounce"
          unvouch-keyword: "!unvouch"
          roles: admin,maintain,write
          pull-request: "true"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: PR title update
        if: steps.vouch.outputs.status != 'unchanged'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --search 'author:app/hatchling-bot in:title "Update VOUCHED list"' --json number --jq '.[].number' \
            | xargs -I{} gh pr edit {} --repo "$GITHUB_REPOSITORY" --title "chore: update VOUCHED list"
